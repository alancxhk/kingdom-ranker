<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kingdom Ranking Checker</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 800px; margin: 30px auto; padding: 0 20px; background: #f4f6f8; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    button { background: #007bff; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-size: 16px; }
    button:hover { background: #0056b3; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
    th { background: #f8f9fa; }
    .target-box { background: #e7f3ff; border-left: 4px solid #007bff; padding: 10px 15px; margin-top: 15px; }
    .loading { color: #666; font-style: italic; }
  </style>
</head>
<body>

  <h1>🏰 Kingdom Ranking Checker</h1>

  <div class="card">
    <div class="form-group">
      <label for="range">Kingdom Range (e.g. 1690-1935):</label>
      <input type="text" id="range" placeholder="1690-1935" value="1690-1935">
    </div>
    <div class="form-group">
      <label for="kid">Target Kingdom ID (Optional):</label>
      <input type="number" id="kid" placeholder="e.g. 1756">
    </div>
    <button onclick="checkRankings()">Search & Rank</button>
  </div>

  <div id="loading" class="loading" style="display:none;">Fetching and calculating data...</div>

  <div id="results" style="display:none;">
    <div id="targetResult"></div>

    <div class="card">
      <h2 id="rangeTitle">Top 10 Kingdoms</h2>
      <table>
        <thead>
          <tr>
            <th>Rank</th>
            <th>Kingdom ID (kid)</th>
            <th>Score</th>
          </tr>
        </thead>
        <tbody id="top10Body"></tbody>
      </table>
    </div>
  </div>

  <script>
    async function checkRankings() {
			const rangeInput = document.getElementById("range");
			const range = rangeInput.value.trim();
			const kid = document.getElementById("kid").value.trim();
			const loading = document.getElementById("loading");
			const results = document.getElementById("results");
			const targetResult = document.getElementById("targetResult");
			const top10Body = document.getElementById("top10Body");
			const rangeTitle = document.getElementById("rangeTitle");

			if (!range) {
				alert("Please enter a kingdom range.");
				return;
			}

			rangeTitle.textContent = `Top 10 Kingdoms in ${range}`;

			loading.style.display = "block";
			results.style.display = "none";

			try {
				const response = await fetch(`https://ks-transfer-ranking.vercel.app/api/rankings?range=${encodeURIComponent(range)}&kid=${encodeURIComponent(kid)}`);
				const data = await response.json();

				if (data.error) {
					alert(data.error);
					return;
				}

				if (data.targetKingdom) {
					const tk = data.targetKingdom;
					if (tk.found) {
						targetResult.innerHTML = `
							<div class="card target-box">
								<h3>🔍 Search Result for Kingdom ${tk.kid}</h3>
								<p><strong>Rank:</strong> #${tk.rank} / ${tk.total}</p>
								<p><strong>Score:</strong> ${tk.score}</p>
							</div>`;
					} else {
						targetResult.innerHTML = `
							<div class="card target-box" style="border-color:#dc3545; background:#fdf2f2;">
								<h3>⚠️ Kingdom ${tk.kid} Not Found</h3>
								<p>Searched across ${tk.total} kingdoms in range ${range}.</p>
							</div>`;
					}
				} else {
					targetResult.innerHTML = "";
				}

				top10Body.innerHTML = data.top10.map(item => `
					<tr>
						<td><strong>#${item.rank}</strong></td>
						<td>${item.kid}</td>
						<td>${item.score}</td>
					</tr>
				`).join("");

				results.style.display = "block";
			} catch (err) {
				console.error(err);
				alert("Failed to connect to the server.");
			} finally {
				loading.style.display = "none";
			}
		}
  </script>
</body>
</html>
